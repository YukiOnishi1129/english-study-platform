substitutions:
  _IMAGE: "web-client/latest"
  _SERVICE_NAME: "web-client-application"

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build -t $_REGION-docker.pkg.dev/$PROJECT_ID/$_IMAGE -f web/client/Dockerfile .

    # Push the container image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_IMAGE"]
    # Deploy container image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "$_SERVICE_NAME",
        "--image",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/$_IMAGE",
        "--region",
        "$_REGION",
        "--quiet",
      ]

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_IMAGE

options:
  logging: CLOUD_LOGGING_ONLY
