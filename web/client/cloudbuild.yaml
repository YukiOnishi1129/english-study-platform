steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "web/client/Dockerfile",
        "-t",
        "gcr.io/$PROJECT_ID/web-client:${SHORT_SHA}",
        ".",
      ]

  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--image",
        "gcr.io/$PROJECT_ID/web-client:${SHORT_SHA}",
        "--region",
        "${_REGION}",
        "--project",
        "$PROJECT_ID",
        "--allow-unauthenticated",
        "--set-env-vars",
        "DB_DRIVER=neon",
        "--set-secrets",
        "DATABASE_URL=projects/$PROJECT_ID/secrets/${_DATABASE_URL_SECRET}:latest",
        "NEXTAUTH_URL=projects/$PROJECT_ID/secrets/${_NEXTAUTH_URL_SECRET}:latest",
        "NEXTAUTH_SECRET=projects/$PROJECT_ID/secrets/${_NEXTAUTH_SECRET_SECRET}:latest",
        "GOOGLE_CLIENT_ID=projects/$PROJECT_ID/secrets/${_GOOGLE_CLIENT_ID_SECRET}:latest",
        "GOOGLE_CLIENT_SECRET=projects/$PROJECT_ID/secrets/${_GOOGLE_CLIENT_SECRET_SECRET}:latest",
      ]

images:
  - "gcr.io/$PROJECT_ID/web-client:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SERVICE_NAME: "web-client-application"
  _REGION: "asia-northeast1"
  _DATABASE_URL_SECRET: "DATABASE_URL"
  _NEXTAUTH_URL_SECRET: "NEXTAUTH_URL"
  _NEXTAUTH_SECRET_SECRET: "NEXTAUTH_SECRET"
  _GOOGLE_CLIENT_ID_SECRET: "GOOGLE_CLIENT_ID"
  _GOOGLE_CLIENT_SECRET_SECRET: "GOOGLE_CLIENT_SECRET"
